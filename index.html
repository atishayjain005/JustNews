<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">

  <style>:focus-visible { outline: 3px solid #0959b7; outline-offset: 4px; } summary { cursor: pointer; padding: 1rem; } details p, details a { margin: 1rem; } .skip-link { position: absolute; top: -100px; } .skip-link:focus { top: 0; background: white; padding: 1rem; z-index: 1; }</style>
  <title>Welcome to JustNews</title>
</head>

<body>
  <a href="#headlines" class="skip-link">Skip to headlines</a>
  <nav class="navbar navbar-expand-lg bg-dark">
    <div class="container-fluid  mx-4 my-2 text-light text-center">
      <h1 class="text-center m-0"><b class="text-info">[+]</b> JustNews </h1>
    </div>
  </nav>

  <main class="container my-5" id="headlines" tabindex="-1">
    <h2>Top headlines</h2>
    <p>Up to 20 stories. Expand a headline to read its summary.</p>
    <hr>
    <p id="newsStatus" role="status" aria-live="polite"></p>
    <button id="retry" type="button" hidden>Try again</button>
    <div class="accordion accordion-flush" id="newsAccordion">
    </div>
    <noscript>Enable JavaScript to load news headlines.</noscript>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>

</html>
