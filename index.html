<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <title>JustNews — Top headlines</title>
</head>
<body>
  <a href="#headlines" class="skip-link">Skip to headlines</a>
  <header><h1><span aria-hidden="true">[+]</span> JustNews</h1></header>
  <main id="headlines" tabindex="-1">
    <h2>Top headlines</h2>
    <p>Up to 20 stories. Expand a headline to read its summary.</p>
    <p id="newsStatus" role="status" aria-live="polite"></p>
    <button id="retry" type="button" hidden>Try again</button>
    <div id="newsAccordion"></div>
    <noscript>Enable JavaScript to load news headlines.</noscript>
  </main>
  <script src="script.js"></script>
</body>
</html>
